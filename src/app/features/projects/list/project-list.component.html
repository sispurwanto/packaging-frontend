<div class="table-wrapper">

  <div class="table-title">Daftar Project</div>
  <button class="btn btn-primary" (click)="create()">+ Project Baru</button>

  <div *ngIf="loading">Loading...</div>

  <table class="app-table">
    <thead>
      <tr>
        <th>ID</th>
        <th>Project</th>
        <th>Steelcase</th>
        <th>Created By</th>
        <th>Created At</th>
        <th class="center">Aksi</th>
      </tr>
    </thead>

    <tbody>
      <tr *ngFor="let p of projects">
        <td>{{ p.id }}</td>
        <td>{{ p.project_name }}</td>
        <td>{{ p.steelcase_id }}</td>
        <td>{{ p.created_by }}</td>
        <td>{{ p.created_at | date:'yyyy-MM-dd HH:mm' }}</td>
        <td class="center">
          <div class="table-actions">
            <button class="btn btn-secondary" (click)="detail(p.id)">
              Detail
            </button>
            <button class="btn btn-danger" (click)="delete(p.id)">
              Hapus
            </button>
          </div>
        </td>
      </tr>
      <tr *ngIf="projects.length === 0">
        <td colspan="6" align="center">Belum ada data</td>
      </tr>
    </tbody>
  </table>

  <!-- 🔽 PAGINATION -->
  <div class="pagination" *ngIf="meta">

    <button
      class="btn"
      [disabled]="!meta.hasPrev"
      (click)="changePage(meta.page - 1)">
      ‹ Prev
    </button>

    <span class="page-info">
      Page {{ meta.page }} / {{ meta.totalPages }}
      (Total {{ meta.count }} data)
    </span>

    <button
      class="btn"
      [disabled]="!meta.hasNext"
      (click)="changePage(meta.page + 1)">
      Next ›
    </button>

  </div>

</div>
