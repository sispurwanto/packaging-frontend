<h2>Daftar Project</h2>

<button (click)="create()">+ Project Baru</button>

<div *ngIf="loading">Loading...</div>

<table border="1" width="100%" *ngIf="!loading">
  <thead>
    <tr>
      <th>ID</th>
      <th>Project Name</th>
      <th>Steelcase</th>
      <th>Created By</th>
      <th>Created At</th>
      <th>Aksi</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let p of projects">
      <td>{{ p.id }}</td>
      <td>{{ p.project_name }}</td>
      <td>{{ p.steelcase_id || '-' }}</td>
      <td>{{ p.created_by }}</td>
      <td>{{ p.created_at | date:'yyyy-MM-dd HH:mm' }}</td>
      <td>
        <button (click)="detail(p.id)">Detail</button>
      </td>
    </tr>

    <tr *ngIf="projects.length === 0">
      <td colspan="6" align="center">Belum ada data</td>
    </tr>
  </tbody>
</table>
